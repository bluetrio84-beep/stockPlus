server {
    listen 80;
    server_name localhost stockplus.158.180.66.45.nip.io harness.158.180.66.45.nip.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- 1. Harness Platform HTTPS ---
server {
    listen 443 ssl;
    server_name harness.158.180.66.45.nip.io;

    ssl_certificate /etc/letsencrypt/live/harness.158.180.66.45.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/harness.158.180.66.45.nip.io/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://harness-frontend-1:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://harness-backend-1:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
    }
}

# --- 2. StockPlus Platform HTTPS ---
server {
    listen 443 ssl;
    server_name stockplus.158.180.66.45.nip.io;
    client_max_body_size 10M;

    ssl_certificate /etc/letsencrypt/live/stockplus.158.180.66.45.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stockplus.158.180.66.45.nip.io/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    location /api/ {
        proxy_pass http://stockplus-backend-1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /api/sse/ {
        proxy_pass http://stockplus-backend-1:8080/api/sse/;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location /terminal-ws {
        proxy_pass http://stockplus-backend-1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
