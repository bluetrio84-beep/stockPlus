version: '3.8'
services:
  mysql:
    image: mysql/mysql-server:latest
    container_name: projects-mysql-1
    ports:
      - "3306:3306"
    environment:
      TZ: Asia/Seoul
      MYSQL_ROOT_PASSWORD: cnbas.2015
      MYSQL_DATABASE: stockplus
      MYSQL_USER: lms
      MYSQL_PASSWORD: cnbas.2015
    volumes:
      - projects_mysql_data:/var/lib/mysql
    networks:
      - stock-network
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost", "-u", "root", "-pcnbas.2015"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: stockplus-backend-1
    ports:
      - "8080:8080"
    environment:
      - TZ=Asia/Seoul
      - DB_HOST=projects-mysql-1
    env_file:
      - .env
    volumes:
      - .:/Projects
      - ./logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - stock-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: stockplus-frontend-1
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /Projects/certbot/conf:/etc/letsencrypt:ro
      - /Projects/certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
    networks:
      - stock-network

  collector:
    build:
      context: ./collector
    container_name: stockplus-collector-1
    init: true
    env_file:
      - .env
    environment:
      - TZ=Asia/Seoul
      - DB_HOST=projects-mysql-1
    network_mode: "host"
    volumes:
      - ./img/snapshots:/app/snapshots
    depends_on:
      mysql:
        condition: service_healthy
    restart: always

  certbot:
    image: certbot/certbot
    container_name: projects-certbot-1
    volumes:
      - /Projects/certbot/conf:/etc/letsencrypt
      - /Projects/certbot/www:/var/www/certbot
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot --webroot-path=/var/www/certbot; docker exec stockplus-frontend-1 nginx -s reload; sleep 12d & wait $${!}; done;'"
    networks:
      - stock-network

networks:
  stock-network:
    name: projects_stock-network
    driver: bridge

volumes:
  projects_mysql_data:
    external: true
