services:
  mysql:
    image: mysql/mysql-server:latest
    container_name: projects-mysql-1
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      TZ: Asia/Seoul
      MYSQL_ROOT_PASSWORD: cnbas.2015
      MYSQL_DATABASE: stockplus
      MYSQL_USER: lms
      MYSQL_PASSWORD: cnbas.2015
      MYSQL_ROOT_HOST: '%'
    ports:
      - "3306:3306"
    volumes:
      - projects_mysql_data:/var/lib/mysql # [복구] 기존 데이터 볼륨 연결
    networks:
      - stock-network
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost", "-u", "root", "-pcnbas.2015"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: stockplus-backend-1
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      TZ: Asia/Seoul
      JAVA_OPTS: "-Xmx3072m -Xms1024m"
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - .:/Projects
      - ./logs:/app/logs
      - ./img/snapshots:/app/snapshots
      - ./img/notes:/app/img/notes
      - /home/lms/.npm-global:/usr/local/npm-global
      - /home/lms/.gemini:/root/.gemini
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - stock-network
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: stockplus-frontend-1
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      TZ: Asia/Seoul
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/Projects
      - /Projects/certbot/conf:/etc/letsencrypt
      - /Projects/certbot/www:/var/www/certbot
    depends_on:
      - backend
    networks:
      - stock-network

  certbot:
    image: certbot/certbot
    container_name: projects-certbot-1
    volumes:
      - /Projects/certbot/conf:/etc/letsencrypt
      - /Projects/certbot/www:/var/www/certbot
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot --webroot-path=/var/www/certbot; docker exec stockplus-frontend-1 nginx -s reload; sleep 12d & wait $${!}; done;'"
    networks:
      - stock-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  collector:
    build:
      context: ./collector
    container_name: stockplus-collector-1
    init: true
    env_file:
      - .env
    network_mode: "host"
    volumes:
      - ./img/snapshots:/app/snapshots
    depends_on:
      mysql:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

volumes:
  projects_mysql_data: # [복구] 기존 볼륨을 외부 볼륨으로 정의
    external: true

networks:
  stock-network:
    name: projects_stock-network
    driver: bridge
