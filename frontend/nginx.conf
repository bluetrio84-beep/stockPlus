server {
    listen 80;
    server_name localhost;

    # 1. 루트 접속 시 서브패스로 리다이렉트
    location = / {
        return 301 /stockPlus/;
    }

    # 2. React App (서브패스 /stockPlus 전용 설정)
    location /stockPlus {
        root /usr/share/nginx/html;
        index index.html;
        # SPA 새로고침 404 방지 핵심 로직
        try_files $uri $uri/ /stockPlus/index.html;

        # 캐시 무효화 (업데이트 즉시 반영)
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # 3. API 프록시
    location /stockPlus/api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
    }

    # 4. SSE 프록시
    location /stockPlus/api/sse/ {
        proxy_pass http://backend:8080/api/sse/;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
