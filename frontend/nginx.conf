server {
    listen 80;
    server_name localhost;

    # 1. 루트 접속 시 서브패스로 리다이렉트
    location = / {
        return 301 /stockPlus/;
    }

    # 2. React App (서브패스 /stockPlus 전용 설정)
    location /stockPlus {
        root /usr/share/nginx/html;
        index index.html;
        # SPA 새로고침 404 방지 핵심 로직
        try_files $uri $uri/ /stockPlus/index.html;

        # 캐시 무효화 (업데이트 즉시 반영)
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # 3. API 프록시
    location /stockPlus/api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
        
        # [v36.101] AI 연산 대기 시간 확보 (5분)
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # [v36.103] 실시간 스트리밍 최적화
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off; # [v36.104] 인코딩 에러 해결
    }

    # 4. SSE 프록시
    location /stockPlus/api/sse/ {
        proxy_pass http://backend:8080/api/sse/;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # 5. Terminal WebSocket 프록시
    location /terminal-ws {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;

        # [v37.90] 터미널 유휴 시간 타임아웃 연장 (1시간)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
