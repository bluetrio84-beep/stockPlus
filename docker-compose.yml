services:
  mysql:
    image: mysql/mysql-server:latest
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      TZ: Asia/Seoul
      MYSQL_ROOT_PASSWORD: cnbas.2015
      MYSQL_DATABASE: stockplus
      MYSQL_USER: lms
      MYSQL_PASSWORD: cnbas.2015
      MYSQL_ROOT_HOST: '%'
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - stock-network
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost", "-u", "root", "-pcnbas.2015"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      TZ: Asia/Seoul
      JAVA_OPTS: "-Xmx3072m -Xms1024m"
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - .:/Projects # 프로젝트 전체 소스 및 gemini 도구 연결
      - ./logs:/app/logs
      - ./img/snapshots:/app/snapshots
      - ./img/notes:/app/img/notes
      - /home/lms/.npm-global:/usr/local/npm-global # gemini 실행 파일 공유
      - /home/lms/.gemini:/root/.gemini # gemini 대화 히스토리 공유
      - /var/run/docker.sock:/var/run/docker.sock # [v36.112] 호스트 도커 제어권 부여
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - stock-network
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      TZ: Asia/Seoul
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - stock-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  collector:
    build:
      context: ./collector
    container_name: projects-collector-1
    init: true
    env_file:
      - .env
    network_mode: "host"
    volumes:
      - ./img/snapshots:/app/snapshots
    depends_on:
      mysql:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

volumes:
  mysql_data:

networks:
  stock-network:
    driver: bridge
